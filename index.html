<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nowenna do św. Józefa</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2b2620;--mu:#7a6f60;--ac:#8a5a2b;--ac2:#f1e4d0;--ok:#4f7a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--card:#27231e;--tx:#efe7d8;--mu:#a89c88;--ac:#d9a066;--ac2:#3a3126;--ok:#8fc088}}
:root[data-theme="dark"]{--bg:#1d1a16;--card:#27231e;--tx:#efe7d8;--mu:#a89c88;--ac:#d9a066;--ac2:#3a3126;--ok:#8fc088}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.6;font-size:var(--fs,17px)}
.w{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.35em;margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:var(--mu);font-size:.85em;margin-bottom:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 16px}
.d{width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font:600 .8em system-ui,sans-serif;cursor:pointer;padding:0}
.d.done{background:var(--ok);border-color:var(--ok);color:#fff}
.d.cur{box-shadow:0 0 0 3px var(--ac2)}
.d.sel{background:var(--ac);color:var(--bg)}
.c{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.c h2{font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:0 0 6px;font-family:system-ui,sans-serif}
.c p{margin:0 0 8px;white-space:pre-line}
.title{font-size:1.15em;font-weight:bold;margin:0 0 4px}
.row{display:flex;gap:8px;margin-top:6px}
button.b{flex:1;padding:13px;border-radius:12px;border:none;background:var(--ac);color:var(--bg);font:600 1em system-ui,sans-serif;cursor:pointer}
button.b.o{background:var(--ac2);color:var(--ac)}
button.b.g{background:var(--ok);color:#fff}
.tools{display:flex;justify-content:space-between;font:.8em system-ui,sans-serif;color:var(--mu);margin-top:18px}
.tools button{background:none;border:none;color:var(--mu);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.note{font:.78em system-ui,sans-serif;color:var(--mu);text-align:center;margin-top:10px}
.fin{text-align:center}
</style>
</head>
<body>
<div class="w">
<h1>🕯️ Nowenna do św. Józefa</h1>
<div class="sub">w intencji dobrego męża · 9 dni modlitwy</div>
<div class="dots" id="dots"></div>
<div id="view"></div>
<div class="tools"><button id="fs">Zmień rozmiar tekstu</button><button id="rs">Zacznij od nowa</button></div>
<div class="note">Postęp zapisuje się na tym urządzeniu.</div>
</div>
<script>
var PRE="Modlitwa na początek",
OPEN="Święty Józefie, mężu Maryi i opiekunie Jezusa, przychodzę do Ciebie z ufnością. Ty znasz moje serce i to, czego pragnę. Proszę Cię o męża, który będzie kochał Boga, szanował mnie i chciał budować rodzinę w wierności i pokoju. Ucz mnie cierpliwości, oczyść moje pragnienia i prowadź mnie drogą, która jest zgodna z wolą Bożą. Amen.",
COMMON="Ojcze nasz…  (1 raz)\nZdrowaś, Maryjo…  (1 raz)\nChwała Ojcu…  (1 raz)",
END="Święty Józefie, patronie rodzin, módl się za mną. Niech stanie się wola Boża w moim życiu. Amen.";
var DAYS=[
["Sprawiedliwy","„Józef, mąż jej, był człowiekiem sprawiedliwym” (Mt 1,19). Nawet w trudnej chwili nie chciał nikogo ranić.","Święty Józefie, wypraszaj mi męża sprawiedliwego, który w trudnych sytuacjach wybiera dobro i prawdę. Naucz i mnie takiej uczciwości wobec innych i wobec siebie."],
["Posłuszny Bogu","Józef zaufał Bożemu głosowi i bez zwłoki przyjął Maryję do siebie (Mt 1,24).","Święty Józefie, proszę o męża, który szuka woli Bożej i potrafi jej zaufać. Daj mi odwagę, abym i ja ufała, nawet gdy nie widzę całej drogi."],
["Troskliwy opiekun","Józef strzegł Maryi i Jezusa, gdy trzeba było uciekać do Egiptu (Mt 2,13–14).","Święty Józefie, proszę o męża, przy którym będę czuła się bezpieczna i szanowana. Pomóż mi też troszczyć się o tych, których Bóg stawia na mojej drodze."],
["Pracowity","Józef utrzymywał rodzinę pracą rąk. Praca była dla niego służbą miłości.","Święty Józefie, proszę o męża odpowiedzialnego i pracowitego, który nie zostawi rodziny samej. Błogosław mojej pracy i uwolnij mnie od lęku o przyszłość."],
["Cichy i pokorny","W Ewangelii nie padło z ust Józefa ani jedno słowo, ale jego czyny mówią bardzo wiele.","Święty Józefie, proszę o męża, który nie potrzebuje wielkich słów, by okazywać miłość. Naucz mnie ciszy, w której słychać Boga."],
["Czysty i szanujący","Józef szanował godność Maryi i tajemnicę, której do końca nie rozumiał.","Święty Józefie, proszę o męża, który szanuje kobietę i potrafi czekać. Oczyść moje serce i pomóż mi wybierać to, co buduje, a nie rani."],
["Cierpliwy w próbach","Józef szukał Jezusa trzy dni w Jerozolimie (Łk 2,41–48) i nie poddał się.","Święty Józefie, nie wiem, jak długo potrwa moje oczekiwanie. Proszę o cierpliwość, ufność i pokój serca. Wzmacniaj moją nadzieję."],
["Mąż Maryi","Józef i Maryja tworzyli rodzinę opartą na wzajemnym zaufaniu i modlitwie.","Święty Józefie, proszę o małżeństwo oparte na wierności, modlitwie i wzajemnym zrozumieniu. Pomóż mi stać się kobietą gotową do takiej miłości."],
["Powierzenie się","Józef całe życie powierzał Bogu to, czego nie mógł kontrolować.","Święty Józefie, powierzam Ci moje pragnienie męża i całą moją przyszłość. Daj mi przyjąć Boży plan, także wtedy, gdy będzie inny, niż sobie wyobrażam."]
];
var S={start:null,done:[],sel:0};
function load(){try{var r=localStorage.getItem("nj");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem("nj",JSON.stringify(S))}catch(e){}}
function cur(){var n=0;while(S.done.indexOf(n)>-1&&n<9)n++;return n}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
 var c=cur(),d=document.getElementById("dots"),h="";
 for(var i=0;i<9;i++){var k="d"+(S.done.indexOf(i)>-1?" done":"")+(i==c?" cur":"")+(i==S.sel&&S.done.indexOf(i)<0?" sel":"");h+='<button class="'+k+'" data-i="'+i+'">'+(i+1)+'</button>'}
 d.innerHTML=h;
 d.querySelectorAll("button").forEach(function(b){b.onclick=function(){S.sel=+b.dataset.i;save();render()}});
 var v=document.getElementById("view");
 if(c>=9&&S.sel>=9){S.sel=8}
 var i=S.sel,x=DAYS[i],isDone=S.done.indexOf(i)>-1;
 var o='<div class="c"><h2>Dzień '+(i+1)+' z 9</h2><div class="title">'+esc(x[0])+'</div><p>'+esc(x[1])+'</p></div>';
 o+='<div class="c"><h2>'+PRE+'</h2><p>'+esc(OPEN)+'</p></div>';
 o+='<div class="c"><h2>Modlitwa dnia</h2><p>'+esc(x[2])+'</p></div>';
 o+='<div class="c"><h2>Modlitwy wspólne</h2><p>'+esc(COMMON)+'</p></div>';
 o+='<div class="c"><h2>Zakończenie</h2><p>'+esc(END)+'</p></div>';
 o+='<div class="row">'+(i>0?'<button class="b o" id="pv">‹ Wstecz</button>':'')+'<button class="b '+(isDone?'o':'')+'" id="dn">'+(isDone?'Cofnij oznaczenie':'Odmówiłam ✓')+'</button>'+(i<8?'<button class="b o" id="nx">Dalej ›</button>':'')+'</div>';
 if(S.done.length==9)o+='<div class="c fin" style="margin-top:14px"><div class="title">🌿 Nowenna zakończona</div><p>Dziękuję, że wytrwałaś. Zostaw resztę Bogu, a sama żyj spokojnie i dobrze.</p></div>';
 v.innerHTML=o;
 var q=function(id){return document.getElementById(id)};
 if(q("pv"))q("pv").onclick=function(){S.sel--;save();render();scrollTo(0,0)};
 if(q("nx"))q("nx").onclick=function(){S.sel++;save();render();scrollTo(0,0)};
 q("dn").onclick=function(){
  var p=S.done.indexOf(i);
  if(p>-1)S.done.splice(p,1);else{S.done.push(i);if(i<8)S.sel=i+1}
  if(!S.start)S.start=new Date().toISOString();
  save();render();scrollTo(0,0)};
}
var sizes=[15,17,19,21],si=1;
document.getElementById("fs").onclick=function(){si=(si+1)%4;document.body.style.setProperty("--fs",sizes[si]+"px");try{localStorage.setItem("njfs",si)}catch(e){}};
document.getElementById("rs").onclick=function(){if(confirm("Zacząć nowennę od początku?")){S={start:null,done:[],sel:0};save();render();scrollTo(0,0)}};
try{var f=localStorage.getItem("njfs");if(f!==null){si=+f;document.body.style.setProperty("--fs",sizes[si]+"px")}}catch(e){}
load();S.sel=Math.min(S.sel,8);if(!S.done.length)S.sel=0;render();
</script>
</body>
</html>
